[package]
description  = "In-memory multilingual full-text index + SQLite content-addressed asset vault for Node.js"
edition      = "2024"
keywords     = ["napi", "search", "fulltext", "sqlite", "asset"]
license      = "AGPL-3.0-or-later"
name         = "assetvault"
repository   = "https://github.com/darkskygit/assetvault"
rust-version = "1.85"
version      = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
assetpack-core               = { version = "0.3", features = ["rusqlite-store"] }
assetpack-transform-precomp2 = "0.3"
memory-indexer               = "0.4"
napi                         = { version = "3", default-features = false, features = ["napi6"] }
napi-derive                  = "3"
rusqlite                     = { version = "0.32", features = ["bundled"] }
serde                        = { version = "1", features = ["derive"] }
serde_json                   = "1"

[build-dependencies]
napi-build = "2"



[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = "z"
strip         = true

# Keep build scripts / C dependencies (sqlite, zstd) at full speed.
[profile.release.build-override]
opt-level = 3
