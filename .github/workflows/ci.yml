name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installs @napi-rs/cli so `napi` is on PATH for `npm run build`.
      # (napi-rs addons cannot be unit-tested with `cargo test`: the N-API
      #  symbols are supplied by the Node runtime at load time, so linking a
      #  test binary fails. Behaviour is tested from JS instead.)
      - name: install
        run: npm install

      - name: typecheck
        run: cargo check --locked

      - name: build native binding
        run: npm run build

      - name: test binding from JS
        run: npm test